<script src="https://code.jquery.com/jquery-3.6.0.min.js"
	integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
<script>
	const container = document.getElementById('leaderboard-container');
	const url = "https://script.google.com/macros/s/AKfycbxUY387D-ehDeWPkSPDShJUvQKLJL79WEH5i-bAWvPmszoMuqgOZ4YVtEskIhRKYQXeEQ/exec?action=getLeaderboard";
	
	function fetchLeaderboard() {
		
		$(".send-div").show();
		fetch(url)
			.then(response => {
				if(!response.ok) {
					throw new Error("Failed to fetch leaderboard");
				}
				return response.json();
			})
			.then(leaderboardData => {
				$(".send-div").fadeOut();

				renderLeaderboard(leaderboardData);
			})
			.catch(err => {
				$(".send-div").fadeOut();

				console.error("Error:", err);
				container.innerHTML = "<p>Failed to load leaderboard.</p>";
		
			});

	}

		function renderLeaderboard(data) {
			container.innerHTML = "";

		const header = document.createElement("div");
		header.className = "d-flex justify-content-evenly align-items-center p-2 fw-bold";
		header.innerHTML = `
			<h4 class="col-1 text-start" style="color: white">Rank</h4>
			<h4 class="col-8 text-center" style="color: white">Name</h4>
			<h4 class="col-1 text-end" style="color: white">Count</h4>
		`;
		container.appendChild(header);

		data.forEach(entry => {
			const card = document.createElement("div");
			card.className = "col-12 leaderboard-row m-2 align-items-center";

				const row = document.createElement("div");
				row.className = "d-flex justify-content-evenly align-items-center p-2";
				console.log(entry);
				row.innerHTML = `
			<h4 class="col-1 text-start">${entry.Rank}</h4>
			<h4 class="col-8 text-center">${entry.Name} (${entry.Semester} ${entry.Branch})</h4>
			<h4 class="col-1 text-center">${entry.Count}</h4>

			`;

				card.appendChild(row);
				container.appendChild(card);
			});
		}
	
	fetchLeaderboard();
</script>
